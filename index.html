<script>
  /* iOS 主屏幕：CSS display-mode:standalone 常不生效，必须用 navigator.standalone */
  (function () {
    try {
      var ua = navigator.userAgent || '';
      var ios = /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) return;
      document.documentElement.classList.add('is-ios');
      if (navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('is-ios-pwa');
      }
    } catch (e) {}
  })();
</script>

<style>
  :root{
    --font-soft:'Nunito',"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",sans-serif;
    /* 旧 iOS 用 constant，新版用 env；桌面默认为 0 */
    --safe-top: 0px;
    --safe-top: constant(safe-area-inset-top);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: 0px;
    --safe-bottom: constant(safe-area-inset-bottom);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top-effective: var(--safe-top);
    --page-top-base: 20px;
    --today-top-base: 12px;
    --page-pad-top: calc(var(--page-top-base) + var(--safe-top-effective));
    --today-pad-top: calc(var(--today-top-base) + var(--safe-top-effective));
  }
  /* 窄屏略增顶部呼吸空间，避免标题贴顶；桌面宽屏仍用上面的默认值 */
  @media (max-width: 48rem){
    :root{
      --page-top-base: 28px;
      --today-top-base: 16px;
      --page-pad-top: calc(var(--page-top-base) + var(--safe-top-effective));
      --today-pad-top: calc(var(--today-top-base) + var(--safe-top-effective));
    }
  }
  /*
   * 实测根因（非横向 ellipsis）：
   * viewport-fit=cover + status-bar default 时内容画进状态栏，
   * env(safe-area-inset-top) 常为 0；标题 top≈32px，47px 状态栏会竖向裁掉上半部（像「折叠」）。
   * 注意：iOS 上 (display-mode:standalone) 经常匹配失败，需配合 html.is-ios-pwa（navigator.standalone）。
   */
  @supports (-webkit-touch-callout: none){
    @media (display-mode: standalone), (display-mode: fullscreen){
      @media (max-width: 48rem){
        :root{
          --safe-top-effective: max(var(--safe-top), 59px);
          --page-pad-top: calc(var(--page-top-base) + var(--safe-top-effective));
          --today-pad-top: calc(var(--today-top-base) + var(--safe-top-effective));
        }
      }
    }
  }
  html.is-ios-pwa{
    --safe-top-effective: max(var(--safe-top), 59px);
    --page-pad-top: calc(var(--page-top-base) + var(--safe-top-effective));
    --today-pad-top: calc(var(--today-top-base) + var(--safe-top-effective));
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html{ font-size:17px; }
  html,body{ overscroll-behavior-y: none; }
  body,#app,#tabbar,#sheet,#toast{ font-family:var(--font-soft); font-weight:400; -webkit-font-smoothing:antialiased; }
  body{ background:#FBF7F0; color:#1F1B16; line-height:1.65; }
  /* 页面顶栏标题：避免行高过紧导致字形上下被裁 */
  .page-heading{
    line-height:1.35;
    overflow:visible;
    min-width:0;
    padding-block:0.125rem;
  }
  /* 衣橱首页顶栏：标题不与「添加」争宽被压扁 */
  .closet-home-title{
    flex:none;
    flex-shrink:0;
    min-width:auto;
    max-width:none;
    white-space:nowrap;
    overflow:visible;
    text-overflow:clip;
  }
  .closet-home-add{
    flex-shrink:0;
    white-space:nowrap;
  }
  @media (min-width: 48rem){
    .closet-home-header{ gap:0.75rem; }
  }
  .page-shell{ box-sizing:border-box; }
  #app .text-\[10px\]{ font-size:0.75rem !important; line-height:1.55 !important; }
  #app .text-\[11px\]{ font-size:0.8125rem !important; line-height:1.55 !important; }
  #app .text-\[13px\]{ font-size:0.9375rem !important; line-height:1.6 !important; }
  #app .text-xs.font-semibold,#app .text-sm.font-semibold,#app .text-sm.font-medium{ font-weight:600 !important; }
  .weather-card-left .text-lg{ font-size:1.25rem; line-height:1.4; font-weight:600; }
  .weather-brief{ line-height:1.45; font-variant-numeric:tabular-nums; }
  .weather-brief .text-xl{ font-size:1.75rem; font-weight:300; line-height:1.15; }
  .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ scrollbar-width:none; }
  .sheet-enter{ transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1); }
  .sheet-enter.show{ transform: translateY(0); }
  .fade-enter{ opacity:0; transition: opacity .2s ease; } .fade-enter.show{ opacity:1; }
  .tab-active{ color:#C8956D; }
  .tab-active svg{ color:#C8956D; }
  input,textarea,select{ font-size:16px; font-family:var(--font-soft); }
  @keyframes pop{ 0%{transform:scale(.96);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop{ animation: pop .18s ease-out; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(72px + var(--safe-bottom)); z-index:9999; }
  .img-wrap-list,.img-wrap-thumb,.img-wrap-rec,.img-wrap-cat,.img-wrap-portrait,.img-wrap-portrait-lg{ overflow:hidden; background:#EDE6DA; flex-shrink:0; }

  .img-wrap-thumb{ width:2.5rem; height:2.5rem; border-radius:0.5rem; }
  .img-wrap-rec{ width:5rem; height:5rem; border-radius:0.5rem; }
  .img-wrap-cat{ width:4.5rem; height:4.5rem; border-radius:0.75rem; }
  .img-wrap-portrait{ width:100%; max-width:12rem; margin:0 auto; aspect-ratio:3/4; max-height:14rem; border-radius:0.75rem; }
  .img-wrap-portrait-lg{ width:100%; max-width:16rem; margin:0 auto; aspect-ratio:3/4; max-height:18rem; border-radius:1rem; }
  .img-wrap-list img,.img-wrap-thumb img,.img-wrap-rec img,.img-wrap-cat img,.img-wrap-portrait img,.img-wrap-portrait-lg img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  /* 衣物详情弹窗顶部预览图：居中长方形，不占满宽度 */
  .detail-cloth-photo{

    max-width:11rem;
    margin:0 auto;
    aspect-ratio:3/4;
    max-height:13.5rem;

    object-position:center;
    border-radius:1rem;
  }
  /* 添加/编辑衣物弹窗图片：统一长方形比例，缩小居中圆角 */
  .form-cloth-photo{
    display:block;
    width:58%;
    max-width:11rem;
    margin:0 auto;
    aspect-ratio:3/4;
    max-height:13.5rem;
    object-fit:cover;
    object-position:center;
    border-radius:1rem;

    border-radius:1rem;

  .global-loading{
    position:fixed; inset:0; z-index:80;
    display:flex; align-items:center; justify-content:center;
    background:rgba(251,247,240,0.72);
    backdrop-filter:blur(2px);
  }
  .global-loading.hidden{ display:none; }
  .global-loading-card{
    background:#fff; border:1px solid #EDE6DA; border-radius:1rem;
    padding:1rem 1.25rem; box-shadow:0 8px 28px rgba(31,27,22,0.08);
    display:flex; align-items:center; gap:0.65rem;
    color:#A8764E; font-size:0.9rem;
  }
  .photo-load-failed{ opacity:0.25; }
  .photo-fallback-tip{
    display:flex;
    align-items:center;
    justify-content:center;
    width:58%;
    max-width:11rem;
    margin:0.5rem auto 0;
    padding:0.5rem 0.75rem;
    border-radius:0.75rem;
    background:#F8EAEA;
    color:#D26565;
    font-size:0.75rem;
    text-align:center;
  }
  .img-wrap-list .photo-fallback-tip,
  .img-wrap-thumb .photo-fallback-tip,
  .img-wrap-rec .photo-fallback-tip,
  .img-wrap-cat .photo-fallback-tip{
    width:100%;
    max-width:none;
    margin:0;
    height:100%;
    border-radius:inherit;
  }
  .img-placeholder{ display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#8A8170; width:100%; height:100%; }
  .avatar-circle{ width:3rem; height:3rem; border-radius:9999px; overflow:hidden; background:#EDE6DA; flex-shrink:0; }
  .avatar-circle.lg{ width:3.5rem; height:3.5rem; }
  .avatar-circle img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .avatar-placeholder{ display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:#8A8170; }
  .action-card{ border-radius:1rem; padding:1.25rem 1rem; display:flex; flex-direction:column; align-items:center; gap:0.625rem; text-align:center; min-height:7.5rem; justify-content:center; }
  .action-card-primary{ background:linear-gradient(135deg,#C8956D,#A8764E); color:#fff; box-shadow:0 4px 14px rgba(200,149,109,0.35); }
  .action-card-secondary{ background:#fff; border:2px solid #C8956D; color:#1F1B16; box-shadow:0 2px 10px rgba(31,27,22,0.06); }
  .emoji-btn{ width:2.5rem; height:2.5rem; font-size:1.35rem; border-radius:0.75rem; border:1px solid #EDE6DA; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .emoji-btn.sm{ width:2rem; height:2rem; font-size:1.1rem; border-radius:0.5rem; }
  .emoji-btn.selected{ border-color:#C8956D; background:#F4E8D8; box-shadow:0 0 0 2px rgba(200,149,109,0.25); }
  /* 打卡表情：可视约 6 个，其余横向滑动 */
  .mood-emoji-scroll{
    display:flex; flex-wrap:nowrap; align-items:center; gap:0.25rem;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    width:100%;
    max-width:calc(6 * 2rem + 5 * 0.25rem + 4px);
    padding:2px 2px 0.125rem;
    box-sizing:content-box;
  }
  .mood-emoji-scroll::-webkit-scrollbar{ display:none; }
  .mood-emoji-scroll{ scrollbar-width:none; }
  .module-disabled{ background:#F0EDE8; border:1px dashed #D8D0C4; opacity:0.85; }
  .weather-card-compact{
    border-radius:1.5rem;
    padding:1.125rem 1.25rem 1.25rem;
    background:linear-gradient(152deg,#FAF4EA 0%,#F6EBDD 42%,#FFFAF4 100%);
    border:1px solid rgba(228,205,178,0.75);
    box-shadow:0 3px 18px rgba(200,149,109,0.1);
  }
  /* 今日卡片顶区：identity / almanac / left / right 分区，窄屏两行，桌面左右栏 */
  .weather-card-top{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "identity almanac"
      "left right";
    column-gap:0.75rem;
    row-gap:0.5rem;
    align-items:start;
  }
  .weather-identity{ grid-area:identity; min-width:0; }
  .weather-almanac-meta{ grid-area:almanac; }
  .weather-card-left{ grid-area:left; min-width:0; }
  .weather-card-right{
    grid-area:right;
    display:flex; flex-direction:column; align-items:flex-end;
  }
  .weather-profile-name-row{
    display:flex; align-items:center; gap:0.75rem; width:100%;
  }
  .weather-profile-name{
    flex:1 1 auto;
    font-size:1.125rem; font-weight:600; line-height:1.35;
    padding-block:0.125rem;
    word-break:break-word;
  }
  .weather-almanac-meta-inner{ text-align:right; }
  @media (max-width: 767.98px){
    .weather-card-top{
      grid-template-columns:1fr auto;
      grid-template-areas:
        "identity identity"
        "almanac almanac"
        "left right";
      row-gap:0.45rem;
    }
    .weather-profile-name-row{ min-width:0; }
    .weather-profile-name{
      flex:1 1 auto;
      min-width:auto;
      max-width:none;
    }
    .weather-almanac-meta-inner{
      text-align:left;
      padding-left:calc(3.375rem + 0.75rem); /* 与昵称左缘对齐 */
    }
    .weather-card-right{ max-width:none; }
  }
  @media (min-width: 768px){
    .weather-card-right{ max-width:14rem; }
  }

  .weather-city-label{ flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #tabbar .grid{ font-size:0.8125rem; line-height:1.35; }

  .closet-sort-bar{ display:flex; align-items:center; justify-content:space-between; gap:0.375rem; margin-bottom:0.75rem; }

  .closet-sort-arrow-active{ color:#C8956D; }
  .closet-cat-card{
    background:#fff; border:1px solid #EDE6DA; border-radius:1rem;
    padding:0.875rem 1rem 1rem; box-shadow:0 1px 8px rgba(200,149,109,0.06);
  }
  .closet-cat-head{ display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-bottom:0.75rem; }
  .closet-cat-title{ font-size:0.9375rem; font-weight:600; color:#1F1B16; line-height:1.3; }
  .closet-cat-action{
    width:1.75rem; height:1.75rem; display:flex; align-items:center; justify-content:center;
    color:#8A8170; border-radius:9999px; flex-shrink:0; background:transparent; border:none; padding:0;
  }
  .closet-cat-action:active{ background:#F4E8D8; color:#A8764E; }
  .closet-cat-scroller{

  .closet-cat-empty{
    width:4.5rem; height:4.5rem; border-radius:0.75rem; border:1.5px dashed #D8D0C4;
    background:#F3EEE6; color:#B0A897; display:flex; align-items:center; justify-content:center;

  }
  .closet-cat-empty:active{ background:#EDE6DA; }
  .closet-list-back{
    display:inline-flex; align-items:center; gap:0.25rem; color:#A8764E;

  }

    position:relative; overflow:hidden; border-radius:1rem;

    position:absolute; inset:0 0 0 auto; width:4.5rem;

    width:4.5rem; border:none; background:transparent; color:#fff;

  }
  .history-swipe-content{
    position:relative; z-index:1; background:#FBF7F0;
    transition:transform .18s ease; will-change:transform;
    border:none; padding:0; width:100%; text-align:left; display:block;
  }
  .history-swipe-content.open{ transition:transform .18s ease; }
  .history-all-btn{
    flex-shrink:0; border:none; background:transparent; color:#A8764E;

  .ck-step-link{

  .ck-step-link:active{ opacity:0.7; }
  .ck-manual-list-scroll{ max-height:min(42vh, 16.5rem); overflow-y:auto; }

    flex-shrink:0; white-space:nowrap;
  }
  .ck-source-ai{ background:#F4E8D8; color:#A8764E; }
  .ck-source-manual{ background:#EDE6DA; color:#8A8170; }
